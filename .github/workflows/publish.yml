name: Publish to PyPI

# Publishes on every GitHub release via trusted publishing.
# One-time setup (maintainer): on pypi.org, add this repo as a trusted
# publisher for the `strata-bench` project (Settings > Publishing).
# After that, creating a GitHub release publishes automatically — no tokens.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

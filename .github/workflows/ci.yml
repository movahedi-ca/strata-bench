name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate sandbox (idempotent)
        run: python scripts/generate_sandbox.py
      - name: Tests
        run: pytest -q
      - name: CLI smoke
        run: |
          strata-bench list-tasks | head
          strata-bench evaluate submissions/examples/literalist.json --format text
